name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S test/host -B build-host
      - run: cmake --build build-host
      - run: ctest --test-dir build-host --output-on-failure

  firmware-build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4
    steps:
      - uses: actions/checkout@v4
      - run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

  bot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r bot/requirements.txt
          pytest bot || [ $? -eq 5 ]